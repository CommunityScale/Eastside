    // UTILITY FUNCTIONS
    function waitForSourcesToLoad(sourceIds, callback) {
        let loadedSources = new Set();

        function checkSourceLoaded(e) { 
            if (sourceIds.includes(e.sourceId)) {
            loadedSources.add(e.sourceId);
            if (loadedSources.size === sourceIds.length) {
                map.off('sourcedata', checkSourceLoaded);
                callback();
            }
            }
        }

        map.on('sourcedata', checkSourceLoaded);
        }

async function computeStatsFromGeoJSON(source_url, property) {
  const response = await fetch(source_url);
  const geojson = await response.json();

  const values = geojson.features
    .map(f => Number(f.properties[property]))
    .filter(v => !isNaN(v))
    .sort((a, b) => a - b);

  if (values.length < 5) {
    console.warn("Not enough valid values to compute breaks.");
    return null;
  }

  function quantile(arr, q) {
    const pos = (arr.length - 1) * q;
    const base = Math.floor(pos);
    const rest = pos - base;
    return arr[base + 1] !== undefined
      ? arr[base] + rest * (arr[base + 1] - arr[base])
      : arr[base];
  }

  const Q1 = quantile(values, 0.25);
  const median = quantile(values, 0.5);
  const Q3 = quantile(values, 0.75);
  const IQR = Q3 - Q1;

  return [median - 1.5 * IQR, Q1, median, Q3, median + 1.5 * IQR];
}


function generateColorStopsFromStats(breaks, colors, property) {
  if (!breaks || breaks.length !== colors.length) return null;

  const interpolateExpr = ["interpolate", 
        ["linear"], 
        ["get", property], 
        ]; //try step vs interpolate --> need to replace with step and leave a default value for lower vals, somewhat interchangeable otherwise  
  for (let i = 0; i < breaks.length; i++) {
    interpolateExpr.push(breaks[i], colors[i]);
  }

  return ["case",
    ["==", ["get", property], null], communityScaleGray,
    interpolateExpr
  ];
}

function getStopsFromLayer(layerId) {
  let expression = map.getPaintProperty(layerId, 'fill-color');

  // Deal with case statements, check for 'interpolate', 'step', or 'match'
  if (Array.isArray(expression) && expression[0] === 'case') {
    expression = expression.find(
      sub => Array.isArray(sub) && ['interpolate', 'step', 'match'].includes(sub[0])
    );
  }

  if (!Array.isArray(expression)) return [];

  const type = expression[0];
  //  Handle 'match'
  if (type === 'match') {
    const stops = expression.slice(2, -1); // skips 'match', ['get', ...], and default color
    const result = [];

    for (let i = 0; i < stops.length; i += 2) {
      result.push({
        value: stops[i],
        color: stops[i + 1]
      });
    }

    return result;
  }

  // Handle 'interpolate' or 'step' expressions
  if (type === 'interpolate' || type === 'step') {
    const stops = expression.slice(3); 
    const result = [];

    for (let i = 0; i < stops.length; i += 2) {
      result.push({
        value: stops[i],
        color: stops[i + 1]
      });
    }

    return result;
  }

  return [];
}

// Define formatting by layer type (univariate)
const percentLayers = ['tracts-pctCostBurdenedRenters', 'tracts-pctCostBurdenedOwners', 'tracts-pctHH', 'tracts-pctChIncome', ];
const currencyLayers = ['tracts-medIncome'];
const numberLayers  = ['parcels-rdAge', 'parcels-rdRace'];

// Update formatting by way of layerId 
function formatLegendLabel(value, layerId) {
  if (typeof value !== 'number') return value; // If not numeric, is treated as normal

  // Percents
  if (percentLayers.includes(layerId)) {
    return `${Math.round(value * 100)}%`;
  }

  // Currency
  if (currencyLayers.includes(layerId)) {
    if (value >= 1500) {
      return `$${(Math.round(value / 1000) * 1000).toLocaleString()}`;
    }
    return `$${Math.round(value).toLocaleString()}`;
  }

  // Basic numeric (best if precision is already set (e.g. to the hundreths))
  if (numberLayers.includes(layerId)) {
    return (value).toLocaleString();
  }

  // Fallback logic 
  if (value < 2) return `${Math.round(value * 100)}%`; 
  if (value >= 1500) return `$${(Math.round(value / 1000) * 1000).toLocaleString()}`;
  return `$${Math.round(value).toLocaleString()}`;
}


// Render legend from stops
function renderLegendFromStops(layerId) {
  const stops = getStopsFromLayer(layerId);
  const palette = palettesByLayer[layerId] || [];

  function getLabel(stop) {
    const match = palette.find(p =>
      (p.value === stop.value) || (p.color.toLowerCase() === stop.color.toLowerCase())
    );
    return match?.label || formatLegendLabel(stop.value, layerId);
  }

  // prevent duplicates
  const seen = new Set();
  const uniqueStops = stops.filter(stop => {
    const label = getLabel(stop);
    const key = `${stop.color.toLowerCase()}|${label}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  const dataLayerHtml = uniqueStops.map((stop, index) => {
    const next = uniqueStops[index + 1];
    const label = getLabel(stop);

    const isFirst = index === 0;
    const isLast  = index === uniqueStops.length - 1;

    let displayLabel = "";

    if (customLabels[layerId]) {
      // Special case: rdAge / rdRace
      if (isFirst) {
        displayLabel = customLabels[layerId].min;
      } else if (isLast) {
        displayLabel = customLabels[layerId].max;
      } else {
        // Keep spacing but hide text
        displayLabel = `<span class="invisible">${label}</span>`;
      }
    } else {
     // Defaults for all others/not custom!!
      const isNumeric = typeof stop.value === 'number';
      if (isNumeric && next && isFirst) {
        displayLabel = `< ${getLabel(next)}`;
      } else if (isNumeric && isLast) {
        displayLabel = `≥ ${label}`;
      } else if (isNumeric && next) {
        displayLabel = `${label} – ${getLabel(next)}`;
      } else {
        displayLabel = label;
      }

    }

    return `
      <div class="flex items-center gap-2">
        <span class="w-3.5 h-3.5 inline-block rounded-sm" style="background-color: ${stop.color};"></span>
        <span>${displayLabel}</span>
      </div>
    `;
  }).join('');

  let dataLayerContainer = document.getElementById('legend-data-layers');
  if (!dataLayerContainer) {
    dataLayerContainer = document.createElement('div');
    dataLayerContainer.id = 'legend-data-layers';
    legendContent.prepend(dataLayerContainer);
  }
  dataLayerContainer.innerHTML = dataLayerHtml;
}

// ---------------- Helper Functions ---------------- //

// Get display name from the sidebar label text
function getOverlayDisplayName(layerId) {
  const input = document.querySelector(`.overlay-toggle[value="${layerId}"]`);
  if (!input) return layerId;

  // Find the <span> containing the text inside the parent <label>
  const labelSpan = input.closest('label')?.querySelector('span');
  return labelSpan?.textContent?.trim() || layerId;
}

function getOverlayColor(layerId) {
  const layer = map.getLayer(layerId);
  if (!layer) return '#999';

  const type = layer.type;
  let paintProp;

  if (type === 'circle') paintProp = 'circle-color';
  else if (type === 'line') paintProp = 'line-color';
  else if (type === 'fill') paintProp = 'fill-color';
  else return '#999';

  let paint = map.getPaintProperty(layerId, paintProp);
  if (!paint) return '#999';

  // if paint is a string, return it
  if (typeof paint === 'string') return paint;

  // if paint is an expression/array, get first color 
  if (Array.isArray(paint)) {
    const colorStop = paint.find(item => typeof item === 'string' && /^#|rgb|hsl/.test(item));
    if (colorStop) return colorStop;
  }

  return '#999'; // fallback
}



// Add overlay to legend
function addOverlayLegendEntry(layerId) {
  const legendContent = document.getElementById('legend-content');
  if (!legendContent) return;

  // add overlay header (once)
  if (!document.querySelector('#legend-overlays-header')) {
    legendContent.insertAdjacentHTML(
      'beforeend',
      `<div class="h-2"></div>
      <p id="legend-overlays-header" class="text-sm font-medium mb-1">Overlays</p>`
    );
  }


  // Avoid duplicates
  if (document.querySelector(`#legend-overlay-${layerId}`)) return;

  // Wait until layer exists
  if (!map.getLayer(layerId)) {
    map.once('idle', () => addOverlayLegendEntry(layerId));
    return;
  }

  const displayName = getOverlayDisplayName(layerId);
  const color = getOverlayColor(layerId);

  const overlayHtml = `
    <div id="legend-overlay-${layerId}" class="flex items-center gap-2 mt-1">
      <span class="w-3 h-3 inline-block rounded-full border border-gray-300"
            style="background-color: ${color};"></span>
      <span class="font-normal">${displayName}</span>
    </div>
  `;

  legendContent.insertAdjacentHTML('beforeend', overlayHtml);
}

// Remove overlay entry from legend

  const entry = document.getElementById(`legend-overlay-${layerId}`);
  if (entry) entry.remove();

});
